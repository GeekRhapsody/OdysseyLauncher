# Retro TV: the sample theme for theme authors (docs/THEMING.md). Copy this folder to ConfigDir/themes/retro-tv/
# (on Windows %APPDATA%\OdysseyLauncher\themes\retro-tv\), then pick it with T or Menu on the systems screen, or with
# `[display] theme = "retro-tv"` in settings.toml.
#
# It shows what the pipeline can do beyond boxes:
# - a game template that isn't a box: a CRT television whose screen shows the game's screenshot, with its logo on a
#   plate on the stand beneath it (a printed title when there's no logo), and no cover slot at all;
# - clips: the TV's aerials sway while it's focused, and it spins up when the game launches;
# - a system model of its own, a console whose cartridge rises and settles (an idle clip), tinted per system.
#
# Its models are generated by godot/src/Tools/RetroTvBuilder.cs (the box template tool); a Blender model with the same
# material and clip names works the same way.
format = 1
name = "Retro TV"
author = "Odyssey Launcher"
look_transition_ms = 450

# A warm living room at night: lamp light from the top left, the glow of the screens from below.
[look.background]
top_left     = "#4A2A18"
top_right    = "#2A1A14"
bottom_left  = "#0C0806"
bottom_right = "#140C0A"

[look.ambient]
colour = "#302824"
energy = 1.0

[[look.lights]]
direction = [0.45, -0.55, -0.7]
colour = "#FFE2B8"
energy = 1.15

[[look.lights]]
direction = [-0.6, 0.35, -0.7]
colour = "#8FB6FF"
energy = 0.35

[defaults]
system_model = "models/systems/console.glb"
tint_system_model = true
game_template = "crt_tv"

[templates.crt_tv]
model = "models/templates/crt_tv.glb"

[templates.crt_tv.slots]
# The screen: the screenshot, else a hero image, else the cover, else the model's own test card ("no signal").
screenshot = ["screenshot", "hero", "cover", "authored"]
# The stand's plate: the logo, else the title the launcher prints on a label.
label = ["logo", "generated"]

[systems.ps2]
colour = "#2B4C9A"

[systems.ps2.look.background]
top_left     = "#1E2A4E"
top_right    = "#3A2418"
bottom_left  = "#06080E"
bottom_right = "#100A08"

[systems.megadrive]
colour = "#2A2A30"

[systems.snes]
colour = "#8C84B0"
