# A test theme for M6: a user theme (copy this folder to ConfigDir/themes/) whose game template shows three media
# slots with different fallback chains, a system card of its own, a two-light look, and per-system looks. Its models
# are generated by godot/src/Tools/BoxTemplateGenerator.cs; the capture and bench commands are in
# docs/perf/m6-themes.md.
format = 1
name = "Slot Showcase"
author = "Odyssey Launcher tests"
look_transition_ms = 400

[look.background]
top_left     = "#3A1030"
top_right    = "#10303A"
bottom_left  = "#080410"
bottom_right = "#041018"

[look.ambient]
colour = "#282830"
energy = 0.9

[[look.lights]]
direction = [-0.3, -0.5, -0.8]
colour = "#FFF4E0"
energy = 1.1

[[look.lights]]
direction = [0.8, 0.1, -0.5]
colour = "#60FFD0"
energy = 0.45

[defaults]
system_model = "models/systems/tile.glb"
tint_system_model = true
game_template = "showcase_case"

# A tall case: the cover on the upper front, a screenshot panel below it, and a spine.
[templates.showcase_case]
model = "models/templates/showcase_case.glb"

[templates.showcase_case.slots]
cover = ["cover", "generated"]
spine = ["spine", "logo", "generated"]
screenshot = ["screenshot", "hero", "authored"]   # "authored": the model's own test-card texture

[systems.ps2]
colour = "#2050C0"

[systems.ps2.look.background]
top_left     = "#102A60"
top_right    = "#301060"
bottom_left  = "#04060C"
bottom_right = "#0A0418"

[systems.snes]
colour = "#8060C0"
