open sky: a title will be printed there later."""

[games.screens]
16bit = """A top-down three-quarter view of a village square at dawn: cobbled paths, a round stone fountain in the \
middle, timbered cottages with red tiled roofs, flower beds, fences, a few round trees and a well. A young swordsman in \
a red cloak and two companions (a mage in a blue robe and a girl with a bow) stand by the fountain, facing an old \
villager with a white beard and a walking stick. Leave the bottom quarter as plain ground: a dialogue window will be \
drawn over it later."""

