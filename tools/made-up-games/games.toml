# The made-up games for the README's captures (docs/readme/): none of them is a real game, and every name, company and
# picture here is invented. README.md in this folder describes the whole process.
#
# Each [[games]] entry is one game's concept: its details (for the details screen, through a gamelist.xml), its box's
# copy and logo, and the prompts Codex paints from (codex_art.py): `keyart`, which every version's cover and label are
# cut from, and [games.screens], one screen per look ("16bit" for the Mega Drive, SNES and arcade ports, "n64",
# "arcade" for an arcade-only game, "arcade_v" for a vertical one), which make_games.py brings to each system's native
# resolution and palette before drawing the HUD. A key art's prompt says its shape: "Landscape, 3:2", its subject in
# the middle third so a Mega Drive cover can cut a portrait from it, or "Portrait, 2:3" for a game on portrait boxes only.
#
# `versions` lists the systems the game came out on, each a release: `system`, `released`, `hud`, and anything it
# changes for that version: title and logo (a "64" version's), players, file (an arcade game's, a MAME-style name),
# screen (its look), screen_fit, crop, dress, logo_place.
#
# hud: "text" draws hud_items, each [text, place] or [text, place, colour] or [text, place, colour, scale], place one of
# tl tc tr bl bc br (tl2 tr2 bl2 br2 a row further in), and "BAR n" a bar n full; "dialogue" (the game's `dialogue`),
# "racer", "shooter", "puzzle" (Kaleidrop's), "flower" (Budling's) and "hearts" are drawn by screens.py; "none" draws
# nothing. crop gives a focus (fractions of the spare width and height) for cutting a painting to a piece's shape:
# cover, label, screen. screen_fit = "pad" widens a screen painting by mirroring its edges instead of cutting it. dress
# picks a system's box design: the Mega Drive's "classic" (bands top and bottom, the default) or "sidebar" (a band down
# the left). logo_place puts the cover's logo at the "top" (the default) or the "bottom".

