age = 7
description = """When a star falls on the night of the coronation, the Crown of Aldmoor splits in two and its halves \
vanish into the wilds. Ren, an apprentice swordsman from the border village of Thornwick, sets out with a reluctant court \
mage and a ranger who knows the mountain passes, to bring the pieces home before the kingdom tears itself apart."""
