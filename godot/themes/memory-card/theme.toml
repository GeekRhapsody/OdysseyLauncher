# The built-in theme (A6): the PS2 memory card browser's look, the box templates generated by
# godot/src/Tools/BoxTemplateGenerator.cs, and a look per built-in system. Every other theme falls back to this one
# for whatever it leaves out. Paths are relative to this folder.
format = 1
name = "Memory Card"
author = "Odyssey Launcher"
look_transition_ms = 300

# The systems grid's look, and every system's unless it has its own.
[look.background]                  # icon.sys-style: one sRGB colour per screen corner
top_left     = "#1B1F4A"
top_right    = "#1B1F4A"
bottom_left  = "#04040C"
bottom_right = "#0B0B24"

[look.ambient]
colour = "#303038"
energy = 1.0

[[look.lights]]                    # 1-3 directional lights; directions are in view space (+Z towards the viewer)
direction = [-0.5, -0.4, -0.75]
colour = "#FFFFFF"
energy = 1.0

[[look.lights]]
direction = [0.7, -0.2, -0.6]
colour = "#8090FF"
energy = 0.5

[[look.lights]]
direction = [0.0, 0.9, -0.4]
colour = "#FF9060"
energy = 0.25

[defaults]
system_model = "models/systems/generic.glb"   # a memory-card slab with a label, for every system
tint_system_model = true                      # its case takes each system's colour
game_template = "generic_box_spine"                    # for systems this theme doesn't list

# Game templates. A material named after a media kind is a slot that shows the game's media of that kind. With no
# `slots` table, each slot is [<its own kind>, "generated"]: the game's art, else a face the launcher draws (a title
# card, or a spine and back in the cover's colour), and always the material's own texture last. For example:
#   [templates.dvd_case.slots]
#   back = ["back", "screenshot", "generated"]
[templates.dvd_case]               # PlayStation 2, GameCube: 135 x 190 x 14 mm
model = "models/templates/dvd_case.glb"

[templates.jewel_case]             # Saturn, Dreamcast, the other CD systems: 142 x 125 x 10.4 mm
model = "models/templates/jewel_case.glb"

[templates.psx_jewel_case]         # PlayStation: the jewel case sized by ScreenScraper's PAL art (1:1 front, 765 x 680 back, 65 x 680 spine): 140.43 x 125 x 13.4 mm
model = "models/templates/psx_jewel_case.glb"

[templates.cartridge_box]          # NES, N64, Game Boy Advance: 135 x 185 x 32 mm
model = "models/templates/cartridge_box.glb"

[templates.gameboy_box]            # Game Boy, Game Boy Color, Super Game Boy: 125 x 125 x 18.2 mm (the scraped art's)
model = "models/templates/gameboy_box.glb"

[templates.generic_box_spine]      # DOS: a PC big box shaped by each game's art; 190 x 240 x 50 mm without any
model = "models/templates/generic_box.glb"
shape = "media"                    # the front takes the cover's proportions, the depth the spine's (A6)

[templates.generic_box_top_spine]  # N64: a landscape big box whose spine is its top and bottom; 190 x 136 x 30 mm without any
model = "models/templates/generic_box_top.glb"
shape = "media"                    # the depth from the spine's height over its width, times the box's width (A7)

[templates.snes_box_horizontal]    # SNES (US, Europe): a landscape cardboard box, its spine on the top and bottom; 190 x 139 x 28 mm
model = "models/templates/snes_box_horizontal.glb"

[templates.snes_box_vertical]      # Super Famicom: a portrait cardboard box, its spine on both sides; 99.6 x 180 x 29.1 mm. Chosen per game
model = "models/templates/snes_box_vertical.glb"

[templates.generic_box_logo]       # Windows, Steam: the same box, with the game's logo along its spine
model = "models/templates/generic_box.glb"
shape = "media"

[templates.generic_box_logo.slots]
spine = ["logo", "generated"]      # the logo, whole, over the cover's colour; else the generated spine with the title

[templates.flat_cover]             # Just the cover, a flat card shaped by it; 3:4 without one. Chosen per game or system
model = "models/templates/flat_cover.glb"
shape = "media"                    # the cover's proportions; it has no thickness, so a spine image changes nothing

[templates.flat_screenshot]        # Just the screenshot, a flat card shaped by it; 4:3 and dark without one. Chosen per game or system
model = "models/templates/flat_screenshot.glb"
shape = "media"                    # no cover material, so the screenshot's proportions

[templates.clamshell]              # Mega Drive, Master System: 136 x 190 x 24 mm
model = "models/templates/clamshell.glb"

[templates.umd_case]               # PSP: 104 x 180 x 14 mm
model = "models/templates/umd_case.glb"

[templates.switch_case]            # Switch: 105 x 172 x 11.5 mm
model = "models/templates/switch_case.glb"

[templates.arcade_cabinet]         # Arcade: the top half of an upright cabinet, its marquee and screen the slots
model = "models/templates/arcade_cabinet.glb"

[templates.arcade_cabinet.slots]
label = ["logo", "generated"]      # the marquee: the logo, whole, over a deep shade; else the title, printed
# The screen keeps the default chain: the screenshot, else the model's own switched-off screen.

[templates.arcade_cabinet.fit]
screenshot = "whole"               # never cropped: a tall game's screenshot is pillarboxed on the switched-off screen

