# The default theme (A6): each system's console as its card. It builds on the base theme, memory-card, like every
# theme: whatever it leaves out is memory-card's. Its games' templates (the boxes, the arcade cabinet) but the Mega
# Drive's cartridge, the colours, and the card for systems without a console of their own (the memory-card slab) all
# come from there. Paths are relative to this folder.
format = 1
name = "Console"
author = "Claudio Filipe"
look_transition_ms = 300

# The systems grid's look, and every system's unless it has its own.
[look.background]                  # icon.sys-style: one sRGB colour per screen corner
top_left     = "#1B1F4A"
top_right    = "#1B1F4A"
bottom_left  = "#04040C"
bottom_right = "#0B0B24"

[look.ambient]
colour = "#303038"
energy = 1.0

[[look.lights]]                    # 1-3 directional lights; directions are in view space (+Z towards the viewer)
direction = [-0.5, -0.4, -0.75]
colour = "#FFFFFF"
energy = 1.0

[[look.lights]]
direction = [0.7, -0.2, -0.6]
colour = "#8090FF"
energy = 0.5

[[look.lights]]
direction = [0.0, 0.9, -0.4]
colour = "#FF9060"
energy = 0.25

# Game templates of this theme's own.
[templates.megadrive_cartridge]
model = "models/templates/megadrive_cartridge.glb"  # built by tools/console-models/mega_drive_cartridge.py: the box art on its label

# System cards: the console's own model. A system's games keep memory-card's template for it unless one is named
# here (game_template = "jewel_case", say: any of memory-card's templates, or one of this theme's).
[systems.gamegear]
model = "models/systems/gamegear.glb"         # built by tools/console-models/game_gear.py, turned to a three-quarter view

[systems.gb]
model = "models/systems/gb.glb"               # built by tools/console-models/game_boy.py, turned to a three-quarter view; its focused clip drops a cartridge in and scrolls the Nintendo logo down

[systems.gbc]
model = "models/systems/gbc.glb"              # built by tools/console-models/game_boy.py, turned to a three-quarter view; its focused clip bonks a cartridge off the top, then slides it in

[systems.gba]
model = "models/systems/gba.glb"              # built by tools/console-models/game_boy.py, turned to a three-quarter view; its focused clip swoops a cartridge in on a barrel roll

[systems.wonderswan]
model = "models/systems/wonderswan.glb"       # built by tools/console-models/wonderswan.py, turned to a three-quarter view; its focused clip somersaults a cartridge into the back, then hops onto its end for a game played upright

[systems.wonderswancolor]
model = "models/systems/wonderswancolor.glb"  # built by tools/console-models/wonderswan.py, turned to a three-quarter view; its focused clip swoops a cartridge in, then leaps onto its end in a full twirl

[systems.nds]
model = "models/systems/nds.glb"                # built by tools/console-models/nintendo_ds.py: a DS Lite open, turned to a three-quarter view; its focused clip slides a game card into slot-1, lights both screens, and the stylus taps TOUCH TO START

[systems.n3ds]
model = "models/systems/n3ds.glb"               # built by tools/console-models/nintendo_ds.py: the first 3DS in Aqua Blue, open, turned to a three-quarter view; its focused clip slides a game card in, lights the HOME Menu, and the stylus taps TOUCH TO START

[systems.wii]
model = "models/systems/wii.glb"                # built by tools/console-models/wii.py: the Wii on its stand, its remote leaning on it; its focused clip slides a disc in, the slot glows, the remote rumbles

[systems.psp]
model = "models/systems/psp.glb"              # built by tools/console-models/psp.py, turned to a three-quarter view; its focused clip turns it round, rolls a UMD into its door, and turns back to the XMB and the game

[systems.mastersystem]
model = "models/systems/mastersystem.glb"      # built by tools/console-models/master_system.py: the first Master System and its Control Pad; its focused clip drops a cartridge in through the dust flap, presses POWER, plays the pad and PAUSE, and later takes the cartridge out

[systems.segacd]
model = "models/systems/segacd.glb"            # built by tools/console-models/mega_cd.py: the first Mega-CD with the Mega Drive (mega_drive.py's) on it; its focused clip slides the tray out, drops a CD in, takes it in while ACCESS flickers, and later ejects it

[systems.megadrive]
model = "models/systems/megadrive.glb"        # built by tools/console-models/mega_drive.py, turned to a three-quarter view; its focused clip inserts a cartridge

[systems.windows]
model = "models/systems/windows.glb"          # built by tools/console-models/windows_pc.py: a gaming PC with a glass side and RGB fans, and its monitor

[systems.dos]
model = "models/systems/dos.glb"              # built by tools/console-models/retro_pc.py: a late-80s 386 desktop with a 14-inch VGA monitor on it

[systems.windows3x]
model = "models/systems/windows3x.glb"        # built by tools/console-models/retro_pc.py: an early-90s 486 desktop with a 14-inch SVGA monitor on it

[systems.windows9x]
model = "models/systems/windows9x.glb"        # built by tools/console-models/retro_pc.py: a late-90s mini tower with a 15-inch monitor beside it

[systems.switch]
model = "models/systems/switch.glb"           # built by tools/console-models/switch.py, turned to a three-quarter view; its focused clip slides the right Joy-Con up its rail and back

[systems.3do]
model = "models/systems/3do.glb"               # built by tools/console-models/threedo.py: a Panasonic FZ-1 and its controller; its focused clip slides the tray out, drops a CD in, takes it in while ACCESS flickers, plays the pad, and later ejects the CD

[systems.atarist]
model = "models/systems/atarist.glb"           # built by tools/console-models/atari_st.py: a 520STFM, its SC1224 showing GEM's desktop, and its mouse; its focused clip slides a floppy in, double-clicks its way to the game, and ejects it

[systems.atari2600]
model = "models/systems/atari2600.glb"         # built by tools/console-models/atari_2600.py: the four-switch woody and its CX40 joystick; its focused clip drops a cartridge in, flips POWER, flicks SELECT and RESET, and waggles the joystick

[systems.cdimono1]
model = "models/systems/cdimono1.glb"          # built by tools/console-models/cdi.py: a Philips CD-i 220 and its gamepad; its focused clip opens the tray, drops a disc in, reads it and plays on the gamepad, then takes the disc out

[systems.colecovision]
model = "models/systems/colecovision.glb"      # built by tools/console-models/colecovision.py: the ColecoVision, one controller in its bay and one in front; its focused clip drops a cartridge in, switches on, picks skill 1 on the keypad and plays the knob and fire button, and later takes the cartridge out

[systems.c64]
model = "models/systems/c64.glb"              # built by tools/console-models/commodore_64.py

[systems.amstradcpc]
model = "models/systems/amstradcpc.glb"       # built by tools/console-models/amstrad_cpc.py: a CPC 464 and its CTM644 monitor; its focused clip loads a game from tape
video = "videos/amstradcpc.mp4"               # drawn by tools/console-models/amstrad_cpc_video.py: the screen through the clip, played on the glass's video material

[systems.amiga]
model = "models/systems/amiga.glb"            # built by tools/console-models/amiga.py: an Amiga 500 and its 1084S monitor, Kickstart 1.3 asking for a disk; its focused clip loads a game from a floppy, then resets with Ctrl and both Amiga keys

[systems.zxspectrum]
model = "models/systems/zxspectrum.glb"       # built by tools/console-models/zx_spectrum.py: a ZX Spectrum 48K and a portable television; its focused clip types LOAD "" and loads a game from tape, stripes and all

[systems.vic20]
model = "models/systems/vic20.glb"             # built by tools/console-models/vic20.py: a Commodore VIC-20 and the ZX Spectrum's portable television, READY. on the screen; its focused clip switches off, plugs a cartridge into the expansion port, switches on to the game and plays it, then takes it out

[systems.zx81]
model = "models/systems/zx81.glb"              # built by tools/console-models/zx81.py: a ZX81 and the ZX Spectrum's portable television; its focused clip types LOAD "" and loads a game through its flickering bands

# The generic MSX shares MSX1's card.
[systems.msx]
model = "models/systems/msx1.glb"

[systems.msx1]
model = "models/systems/msx1.glb"              # built by tools/console-models/msx.py: a Philips VG-8020; its focused clip flips the lid back, drops a cartridge in, switches on, and plays the cursor keys

[systems.msx2]
model = "models/systems/msx2.glb"              # built by tools/console-models/msx2.py: a Philips VG-8235, the MSX2 with its 3.5 drive in its right end; its focused clip slides a disk into the drive, flickers FDD BUSY, plays the cursor keys, the space bar and CAPS, then ejects the disk

[systems.flash]
model = "models/systems/flash.glb"             # built by tools/console-models/flash.py: Flash has no hardware, so a 2000s LCD monitor playing a Flash game in a browser, and its mouse; its focused clip fills the preloader, clicks PLAY, plays, and right-clicks the Flash Player's menu

[systems.pico8]
model = "models/systems/pico8.glb"             # built by tools/console-models/pico8.py: PICO-8 has no hardware, so its cartridge made solid, its label a screen; its focused clip hops it round once and boots its label into a game

[systems.amigacd32]
model = "models/systems/amigacd32.glb"         # built by tools/console-models/cd32.py: the Amiga CD32 and its pad; its focused clip swings the lid up, drops a CD in, plays the pad's coloured buttons, and later takes the CD out

[systems.apple2]
model = "models/systems/apple2.glb"            # built by tools/console-models/apple2.py: an Apple IIe, two Disk II drives and a Monitor II; its focused clip boots a game from a floppy, its title screen arriving in hi-res's line order, then resets

[systems.apple2gs]
model = "models/systems/apple2gs.glb"          # built by tools/console-models/apple2gs.py: an Apple IIGS, its AppleColor RGB monitor, 3.5 drive, keyboard and mouse; its focused clip slides a disk in, boots GS/OS to a game's title, presses RETURN and plays, then ejects the disk

[systems.fds]
model = "models/systems/fds.glb"               # built by tools/console-models/fds.py: a Famicom with its RAM adapter on its Disk System drive; its focused clip slides a disk card in, ejects it, turns it over to side B and puts it back

[systems.neogeo]
model = "models/systems/neogeo.glb"            # built by tools/console-models/neogeo.py: a Neo Geo AES and its arcade stick; its focused clip drops a cartridge in, switches on, throws two fireballs and a combo on the stick, and later takes the cartridge out

[systems.nes]
model = "models/systems/nes.glb"

[systems.pcengine]
model = "models/systems/pcengine.glb"          # built by tools/console-models/pc_engine.py: the white PC Engine, a HuCard and its pad; its focused clip slides the HuCard in along its channel, slides POWER on and plays the pad, and later takes the HuCard out

[systems.psx]
model = "models/systems/psx.glb"                # built by tools/console-models/psx.py, turned to a three-quarter view; its focused clip opens the lid, drops a disc in, and later ejects it

[systems.snes]
model = "models/systems/snes.glb"               # built by tools/console-models/snes.py: the PAL console, turned to a three-quarter view; its focused clip drops a cartridge through the dust flaps, switches on, and later ejects it

[systems.gc]
model = "models/systems/gc.glb"                # built by tools/console-models/gamecube.py: an indigo GameCube, its handle and its controller; its focused clip springs the lid open, drops a mini disc in, switches on and plays the controller, and later takes the disc out

[systems.naomi]
model = "models/systems/naomi.glb"             # built by tools/console-models/naomi.py: NAOMI is an arcade board, so a Sega candy cabinet with NAOMI on its marquee; its focused clip drops a coin in, presses START and plays, then shows NAOMI's logo again

[systems.n64]
model = "models/systems/n64.glb"               # built by tools/console-models/n64.py: the console and its controller; its focused clip drops a cartridge in through the dust flaps, slides POWER on, swings the stick and presses the buttons, and later takes the cartridge out

[systems.ps2]
model = "models/systems/ps2.glb"                # built by tools/console-models/ps2.py: the black launch model, turned to a three-quarter view; its focused clip slides the tray out, drops a DVD on it, and later ejects it

[systems.satellaview]
model = "models/systems/satellaview.glb"       # built by tools/console-models/snes.py: a Super Famicom on its Satellaview; its focused clip drops the BS-X cartridge in, switches on, and the receiver takes a broadcast

[systems.saturn]
model = "models/systems/saturn.glb"

[systems.dreamcast]
model = "models/systems/dreamcast.glb"

# Favourites and Recently played have no console: a Power Star and an alarm clock.
[systems.favourites]
model = "models/systems/favourites.glb"       # built by tools/console-models/power_star.py: Super Mario 64's Power Star; its focused clip opens its eyes, hops, spins and wiggles

[systems.recently_played]
model = "models/systems/recently_played.glb"  # built by tools/console-models/alarm_clock.py: the Dreamcast settings menu's alarm clock; its focused clip is the menu's: a one-second rocking roll with hops, scissoring hands and pulsing bells
