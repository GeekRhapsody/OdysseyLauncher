# Built-in settings. Your ConfigDir/settings.toml only needs the values you want to change.
format = 1

[paths]
# Each system's ROMs default to {rom_root}/<system id>, e.g. {rom_root}/megadrive.
rom_root = "{home}/ROMs"
# The media folder: every game's images, videos and models, a folder per system. Unset, it's media in the data
# folder (%LOCALAPPDATA%\OdysseyLauncher\media, or userdata\media when portable). Settings > Media folder moves it.
# media = "D:/Launcher media"

[scanning]
# Skipped in every system's ROM folders, before each system's own `exclude`. Patterns without '/' match a
# file or folder name at any depth; an excluded folder isn't listed at all, which matters most on network
# shares. The defaults skip ES-DE's per-system media folders and gamelist files. Set your own list to replace it.
exclude = ["images", "manuals", "videos", "gamelist.xml"]
# Rescan every system each time the app starts, in the background, for games added, moved or removed since. false
# scans only systems never scanned; Settings > Rescan the library (or F5) scans the rest when you ask.
scan_at_launch = false

[variables]
# Expanded when config loads. Values may use {home} and other variables.
# The built-in emulator profiles use these; point them at your installs.
retroarch = "C:/RetroArch-Win64"
emulators = "C:/Emulators"

[display]
# A theme in the app's themes/ folder or in yours. memory-card is the base every theme builds on, not a theme to choose.
theme = "slab"
# "borderless" (a window covering the screen), "fullscreen" (exclusive) or "windowed". Both fullscreen modes use the
# desktop's resolution.
screen_mode = "borderless"
# The resolution the 3D renders at in the fullscreen modes; the menus and text are always at the screen's.
# "auto" (at most 1080p, so a 4K screen renders its 3D at half size), "native", or a height such as 720 or 1440.
render_resolution = "auto"
# The window's size when screen_mode is "windowed".
window_size = "1280x800"
# "d3d12" (Direct3D 12) or "vulkan". Used from the next start.
rendering_driver = "d3d12"
# Anisotropic filtering: 0 (off), 2, 4, 8 or 16 (the most graphics cards support).
anisotropic_filtering = 16
# The systems grid leaves out systems with no games, so the long built-in list only shows what you have.
# false shows every enabled system, empty or not.
hide_empty_systems = true
# How the systems are shown: "grid", "carousel" (one row, the focused system in the middle) or "single" (one at a
# time, filling the screen; left and right move to the next).
systems_layout = "grid"
# The grid's columns (1 to 9) and the rows that fit the screen's height (1 to 6); 0 is automatic: as many as fit.
systems_columns = 0
systems_rows = 0
# How a system's games are shown: "grid", "carousel" or "list" (the titles, with the focused game's model beside them).
# A system can have its own: games_layout in systems.toml.
games_layout = "grid"
# The games grid's columns and rows, as above. A system can have its own: games_columns and games_rows in systems.toml.
games_columns = 0
games_rows = 0
# The systems' order: "alphabetical" (by name), "manufacturer", "release_year" or "manufacturer_year" (by
# manufacturer, then year); ties go by name. Favourites and Recently played always come first.
systems_sort = "alphabetical"
# "ascending" (A to Z, oldest first) or "descending". Systems without a manufacturer or year come last either way.
systems_sort_order = "ascending"
# A system's games' order: "alphabetical" (by title), "last_played", "play_time", "added" (when the file arrived in
# the ROM folder) or "release_date"; ties go by title. A system can have its own: games_sort in systems.toml.
games_sort = "alphabetical"
# "ascending" (A to Z, oldest first, least played first) or "descending". Games never played (by last played) or
# without a release date come last either way. A system can have its own: games_sort_order in systems.toml.
games_sort_order = "ascending"

[ui]
# The status indicators, top right: the time (in your Windows time format), the battery's charge (only on a
# device with a battery) and the network (Wi-Fi with its signal, a cable, or disconnected).
show_clock = true
show_battery = true
show_network = true
# The frame rate and the video memory the app uses, under the indicators.
show_performance = false
# A tock when the focus moves to another system or game, and a whoosh when you enter a system.
navigation_sounds = true

[scraping]
# Every game is looked up with `provider` first; each `fallback` provider, in order, then fills in the fields
# and media still missing. Providers are "screenscraper", "igdb", "steamgriddb" and "steam" (the Steam store's
# official art and metadata, found by title, with no credentials; only for systems with steam_store = true, Windows
# and Steam). A provider with no credentials in secrets.toml (or ODYSSEY_* environment variables) is skipped, and
# scraping says so. For Steam's own art on PC games first: provider = "steam" and
# fallback = ["screenscraper", "igdb", "steamgriddb"]; every other system then starts with ScreenScraper.
provider = "screenscraper"
fallback = ["igdb", "steamgriddb"]
regions = ["eu", "wor", "us", "jp"]    # ScreenScraper region codes; first available wins
languages = ["en"]
# Media kinds to download: cover, back, spine, screenshot, logo (ScreenScraper's wheel), hero (fan art),
# label (ScreenScraper's support texture: a disc's or cartridge's art) and video (an MP4, which nothing plays yet).
# Only ScreenScraper has back, spine, label and video.
media = ["cover", "back", "spine", "screenshot", "logo"]
# ROMs up to this size are hashed (CRC32, MD5, SHA-1) once, for ScreenScraper lookups, which ask for a hash.
# Bigger files (disc images) are looked up by name and size only. 0 hashes nothing.
hash_limit_mb = 64
