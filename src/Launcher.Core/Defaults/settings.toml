# Built-in settings. Your ConfigDir/settings.toml only needs the values you want to change.
format = 1

[paths]
# Each system's ROMs default to {rom_root}/<system id>, e.g. {rom_root}/megadrive.
rom_root = "{home}/ROMs"

[scanning]
# Skipped in every system's ROM folders, before each system's own `exclude`. Patterns without '/' match a
# file or folder name at any depth; an excluded folder isn't listed at all, which matters most on network
# shares. The defaults skip ES-DE's per-system media folders and gamelist files. Set your own list to replace it.
exclude = ["images", "manuals", "videos", "gamelist.xml"]

[variables]
# Expanded when config loads. Values may use {home} and other variables.
# The built-in emulator profiles use these; point them at your installs.
retroarch = "C:/RetroArch-Win64"
emulators = "C:/Emulators"

[display]
theme = "memory-card"
fullscreen = true
# The systems grid leaves out systems with no games, so the long built-in list only shows what you have.
# false shows every enabled system, empty or not.
hide_empty_systems = true

[scraping]
# Every game is looked up with `provider` first; each `fallback` provider, in order, then fills in the fields
# and media still missing. Providers are "screenscraper", "igdb", "steamgriddb" and "steam" (the Steam store's
# official art and metadata, found by title, with no credentials; only for systems with steam_store = true, Windows
# and Steam). A provider with no credentials in secrets.toml (or ODYSSEY_* environment variables) is skipped, and
# scraping says so. For Steam's own art on PC games first: provider = "steam" and
# fallback = ["screenscraper", "igdb", "steamgriddb"]; every other system then starts with ScreenScraper.
provider = "screenscraper"
fallback = ["igdb", "steamgriddb"]
regions = ["eu", "wor", "us", "jp"]    # ScreenScraper region codes; first available wins
languages = ["en"]
# Media kinds to download: cover, back, spine, screenshot, logo (ScreenScraper's wheel), hero (fan art),
# label (ScreenScraper's support texture: a disc's or cartridge's art) and video (an MP4, which nothing plays yet).
# Only ScreenScraper has back, spine, label and video.
media = ["cover", "back", "spine", "screenshot", "logo"]
# ROMs up to this size are hashed (CRC32, MD5, SHA-1) once, for ScreenScraper lookups, which ask for a hash.
# Bigger files (disc images) are looked up by name and size only. 0 hashes nothing.
hash_limit_mb = 64
