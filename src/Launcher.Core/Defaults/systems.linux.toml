# Linux's own values for the built-in systems, merged over systems.toml on Linux (docs/ARCHITECTURE.md A5, "Built-in
# emulators on Linux"): a system's emulator and alternatives where Linux's differ (its Windows default where Linux has
# it), and its extensions without Windows' own file types and with Linux's (.desktop, .sh, .AppImage). A regional
# variant has its system's.

format = 1

[systems.ags]
extensions = [".desktop", ".sh"]

[systems.amiga]
alt_emulators = ["retroarch-puae2021", "fs-uae-amiga", "amiberry-amiga"]

[systems.amigacd32]
