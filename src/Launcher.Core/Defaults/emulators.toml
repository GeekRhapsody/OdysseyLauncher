# Built-in emulator profiles. Your ConfigDir/emulators.toml layers over these; set {retroarch} and
# {emulators} under [variables] in settings.toml to point at your installs.
#
# Each args entry becomes exactly one argument; there's no shell and no quoting. Launch placeholders:
# {rom} {rom_dir} {rom_file} {rom_name} {system} {emulator_dir}. Write {{ or }} for a literal brace.
# working_dir defaults to "{emulator_dir}". .bat and .cmd executables are rejected.
#
# These command lines haven't been launched yet: M3 checks each one against a real install.

format = 1

[emulators.retroarch-gambatte]
name = "RetroArch: Gambatte"
executable = "{retroarch}/retroarch.exe"
args = ["-L", "{retroarch}/cores/gambatte_libretro.dll", "--fullscreen", "{rom}"]

[emulators.retroarch-mgba]
name = "RetroArch: mGBA"
