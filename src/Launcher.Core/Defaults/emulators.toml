# Built-in emulator profiles. Your ConfigDir/emulators.toml layers over these; set {retroarch} and
# {emulators} under [variables] in settings.toml to point at your installs.
#
# Each args entry becomes exactly one argument, and the launcher quotes it for you: don't add quotes for
# paths with spaces. Launch placeholders:
#   {rom}       the ROM's absolute path          {rom_dir}       the folder it's in
#   {rom_file}  its file name                    {rom_stem}      its file name without the extension
#   {system}    the system id                    {emulator}      the expanded executable
#   {emulator_dir}  the executable's folder      {core}          the profile's `core`, expanded
# Write {{ or }} for a literal brace. working_dir defaults to "{emulator_dir}". .bat and .cmd executables
# are rejected. A game can use another profile through its per-game emulator override.
#
# The RetroArch core file names and the pcsx2-qt.exe name were checked against a RetroBat install on
# 2026-09-28. The command-line flags follow each emulator's documentation.

format = 1

[emulators.retroarch-gambatte]
name = "RetroArch: Gambatte"
executable = "{retroarch}/retroarch.exe"
core = "{retroarch}/cores/gambatte_libretro.dll"
args = ["-L", "{core}", "--fullscreen", "{rom}"]

[emulators.retroarch-mgba]
name = "RetroArch: mGBA"
