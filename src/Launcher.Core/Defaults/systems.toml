# Built-in systems. Your ConfigDir/systems.toml only needs what you change, for example:
#
#   [systems.megadrive]
#   rom_dirs = ["E:/Sega/Mega Drive", "F:/More Mega Drive"]   # default: {rom_root}/megadrive, then each alias
#   emulator = "blastem"
#
#   [systems.mastersystem]
#   enabled = false
#
# Ids follow ES-DE and RetroBat folder names, so existing collections work without moving files.
# Aliases are tried as default folder names too.
#
## igdb_platforms: IGDB platform ids, cross-checked on 2026-09-28 between RomM's IGDB platform table and an
# IGDB platform list. NES and SNES add their Japanese twins (Family Computer 99, Super Famicom 58), where
# Japan-only releases are filed.
#
# manufacturer and year (the year the system first came out anywhere) are shown in the systems view and can sort
# it ([display] systems_sort in settings.toml). The missing manufacturers were written from memory on 2026-10-03
# and aren't verified.
#
# year and description come from ES-DE's theme metadata (themes/linear-es-de/system/metadata/<id>.xml in ES-DE's
# repository, read on 2026-10-03): the year is the earliest systemReleaseYear of the system and its aliases (the
# Mega Drive's is megadrivejp's 1988, not megadrive's 1990), the description the system's own English
# systemDescription (astrocde's is astrocade.xml), its paragraphs joined, its dates day first and its spelling
# British (product names such as Game Boy Color keep theirs). ES-DE gives the catch-all systems (arcade,
# consolearcade, desktop, lcdgames, pcarcade, ports) no year ("Various"), so they come last when sorting by year.
#
# Extensions: .m3u, .cue and .gdi group multi-file games, and the files they reference are hidden.
# Disc systems leave out .bin, so stray tracks never show as games.
#
# Each system's game model (a box template) comes from the theme. game_model = "<template id>" picks one of
# the theme's templates for a system instead, e.g. game_model = "jewel_case" for a new CD system.

format = 1

[systems.gb]
name = "Game Boy"
manufacturer = "Nintendo"
year = 1989
description = "The Game Boy is an 8-bit handheld video game console developed and manufactured by Nintendo. It was released in Japan on 21 April 1989, in North America in August 1989, and in Europe in 1990. In Southern Asia, it is known as the \"Tata Game Boy\" It is the first handheld console in the Game Boy line. It was created by Gunpei Yokoi and Nintendo's Research and Development — the same staff who had designed the Game & Watch series as well as several popular games for the NES. The Game Boy was Nintendo's second handheld system following the Game & Watch series introduced in 1980, and it combined features from both the Nintendo Entertainment System and Game and Watch. It was also the first handheld game to use video game cartridges since Milton Bradley's Microvision handheld console. It was originally bundled with the puzzle game Tetris. Despite many other, technologically superior handheld consoles introduced during its lifetime, the Game Boy was a tremendous success. The Game Boy and Game Boy Color combined have sold 118.69 million units worldwide. Upon its release in the United States, it sold its entire shipment of one million units within weeks."
