# ---------------------------------------------------------------------------------------------
# Every other ES-DE system
#
# Converted from ES-DE 3.5.0's es_systems.xml (ids, names, extensions and commands). Regional twins and duplicates
# are aliases of one system (genesis and megadrivejp of megadrive, sfc and snesna of snes, ...), whose folder
# names are tried as default ROM folders, so ES-DE's folders still work. The first ES-DE command is the default
# emulator and the others are alternatives (ids in emulators.toml). A system with no ROMs has no card in the grid
# ([display] hide_empty_systems). Left out: desktop, emulators, windows, steam, kodi and epic (not systems), the
# placeholder-only systems (androidapps, androidgames, lutris, xboxone) and psvita (Vita3K needs a title id that
# ES-DE reads from a .psvita file).
#
# screenscraper_id and igdb_platforms below this line were written from memory, NOT checked against ScreenScraper
# or IGDB (the ones above were, 2026-09-28). A wrong id scrapes the wrong platform's games: run
# `odyssey-scrape ss-systems` (it lists ScreenScraper's table against these ids) before scraping them. A system
# without ids isn't looked up on that provider.
# ---------------------------------------------------------------------------------------------

