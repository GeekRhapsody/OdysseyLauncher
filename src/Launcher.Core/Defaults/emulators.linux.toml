# Built-in emulator profiles on Linux. Windows has its own, emulators.windows.toml; a profile with the same emulator
# has the same id and name in both, so systems.toml names it on either: keep them in step when adding or renaming one.
# Your ConfigDir/emulators.toml layers over this file.
#
# executable and core list the places to look, in order (docs/ARCHITECTURE.md A5, "Finding programs"): a bare name is
# looked for on the PATH, a * in a file name matches the newest such file, and anything else must exist. {emulators},
# {flatpak}, {retroarch} and {retroarch_cores} are lists of places in [variables] (settings.toml): set one there to
# point every profile using it somewhere else. Arguments and placeholders are as in emulators.windows.toml.
#
# Windows programs run through Wine or Proton aren't offered. A system with no Linux emulator keeps its Windows profile
# ("Windows only" below), so its games still show; it's never found until you choose a program for it in
# Settings > Emulators.

format = 1


[emulators.retroarch-gambatte]
name = "RetroArch: Gambatte"
executable = "{retroarch}"
core = "{retroarch_cores}/gambatte_libretro.so"
args = ["-L", "{core}", "--fullscreen", "{rom}"]

